<!doctype html>
<html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Library Admin</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script></head>
<body class="min-h-screen bg-slate-950 text-white"><header class="border-b border-slate-800 p-4"><div class="mx-auto flex max-w-7xl items-center justify-between"><h1 class="text-xl font-bold">Library Admin Dashboard</h1><button id="logout" class="hidden rounded-lg bg-slate-700 px-4 py-2">Logout</button></div></header>
<main class="mx-auto max-w-7xl p-4 md:p-6">
<section id="loginPanel" class="mx-auto mt-12 max-w-md rounded-2xl border border-slate-800 bg-slate-900 p-6"><h2 class="mb-4 text-2xl font-bold">Admin Login</h2><form id="loginForm" class="space-y-3"><input id="email" type="email" required placeholder="Admin email" class="w-full rounded-lg bg-slate-800 p-3"><input id="password" type="password" required placeholder="Password" class="w-full rounded-lg bg-slate-800 p-3"><button class="w-full rounded-lg bg-indigo-600 p-3 font-semibold">Login</button></form><p id="loginError" class="mt-3 text-sm text-red-400"></p></section>
<section id="dashboard" class="hidden"><div class="mb-5 flex flex-wrap gap-3"><div class="rounded-xl bg-green-500/15 px-4 py-3">खाली: <b id="vacantCount">0</b></div><div class="rounded-xl bg-red-500/15 px-4 py-3">भरी: <b id="occupiedCount">0</b></div><div class="rounded-xl bg-yellow-500/15 px-4 py-3">एक्सपायरी: <b id="expiringCount">0</b></div></div>
<div class="mb-6 flex flex-wrap items-center justify-between gap-3"><h2 class="text-xl font-bold">सीट मैनेजमेंट (1–75)</h2><button id="refresh" class="rounded-lg bg-slate-700 px-4 py-2">Refresh</button></div><div id="seatGrid" class="grid grid-cols-5 gap-2 sm:grid-cols-8 md:grid-cols-10 lg:grid-cols-10"></div>
<section class="mt-8 rounded-2xl border border-slate-800 bg-slate-900 p-5"><h2 class="mb-2 text-xl font-bold">सभी सीटों के QR कोड</h2><p class="mb-4 text-sm text-slate-400">साइट का सही public URL सेट करें, फिर QR जनरेट और डाउनलोड करें।</p><button id="generateAll" class="rounded-lg bg-indigo-600 px-4 py-2">75 QR Generate करें</button><div id="qrGrid" class="mt-5 grid grid-cols-2 gap-4 sm:grid-cols-4 md:grid-cols-6"></div></section>
</section></main>
<div id="seatModal" class="fixed inset-0 hidden items-center justify-center bg-black/70 p-4"><div class="w-full max-w-md rounded-2xl bg-slate-900 p-6"><div class="mb-4 flex justify-between"><h2 id="modalTitle" class="text-xl font-bold">सीट</h2><button id="closeModal" class="text-2xl">×</button></div><form id="seatForm" class="space-y-3"><input id="studentNameInput" placeholder="छात्र का नाम" class="w-full rounded-lg bg-slate-800 p-3"><input id="phoneInput" placeholder="मोबाइल नंबर" inputmode="numeric" class="w-full rounded-lg bg-slate-800 p-3"><label class="block text-sm text-slate-300">वैलिडिटी</label><select id="months" class="w-full rounded-lg bg-slate-800 p-3"><option value="30">1 महीना (30 दिन)</option><option value="90">3 महीने (90 दिन)</option></select><button class="w-full rounded-lg bg-indigo-600 p-3 font-semibold">नया एडमिशन / अपडेट</button></form><div class="mt-3 grid grid-cols-2 gap-2"><button id="cashRenew" class="rounded-lg bg-emerald-700 p-3">कैश रिन्यूअल</button><button id="makeVacant" class="rounded-lg bg-red-700 p-3">सीट खाली करें</button></div><p id="modalMsg" class="mt-3 text-sm text-slate-300"></p></div></div>
<script>
// Use only the Supabase anon/publishable key here. Admin permissions are enforced by RLS.
const SUPABASE_URL='https://YOUR_PROJECT.supabase.co';const SUPABASE_ANON_KEY='YOUR_SUPABASE_ANON_KEY';
const PUBLIC_SITE_URL='https://YOUR-SITE.pages.dev';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const $=id=>document.getElementById(id);let currentSeat=null;let seatCache=[];
const localDateString=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const isExpiring=s=>s.status==='occupied'&&s.expiry_date&&new Date(s.expiry_date+'T23:59:59')<=new Date(Date.now()+3*86400000);
async function checkSession(){const {data:{session}}=await db.auth.getSession();if(!session)return showLogin();const {data:{user}}=await db.auth.getUser();if(user?.app_metadata?.role!=='admin'){await db.auth.signOut();$('loginError').textContent='इस अकाउंट को Admin अनुमति नहीं है।';return showLogin();}showDashboard();await loadSeats();}
function showLogin(){$('loginPanel').classList.remove('hidden');$('dashboard').classList.add('hidden');$('logout').classList.add('hidden')}
function showDashboard(){$('loginPanel').classList.add('hidden');$('dashboard').classList.remove('hidden');$('logout').classList.remove('hidden')}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').textContent='';const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){$('loginError').textContent=error.message;return;}await checkSession()});
$('logout').onclick=async()=>{await db.auth.signOut();showLogin()};$('refresh').onclick=loadSeats;
async function loadSeats(){const {data,error}=await db.from('seats').select('*').order('seat_number');if(error){alert(error.message);return;}seatCache=data||[];const vacant=seatCache.filter(s=>s.status==='vacant').length,occupied=seatCache.length-vacant,exp=seatCache.filter(isExpiring).length;$('vacantCount').textContent=vacant;$('occupiedCount').textContent=occupied;$('expiringCount').textContent=exp;
$('seatGrid').innerHTML='';for(let n=1;n<=75;n++){const s=seatCache.find(x=>x.seat_number===n);const color=!s||s.status==='vacant'?'bg-green-700':isExpiring(s)?'bg-yellow-500 text-black':'bg-red-700';const b=document.createElement('button');b.className=`${color} min-h-14 rounded-lg p-2 text-sm font-bold hover:brightness-125`;b.textContent=n;b.title=s?.student_name||'Vacant';b.onclick=()=>openSeat(n,s);$('seatGrid').appendChild(b);}}
function openSeat(n,s){currentSeat=n;$('modalTitle').textContent=`सीट ${n}`;$('studentNameInput').value=s?.student_name||'';$('phoneInput').value=s?.phone||'';$('months').value='30';$('modalMsg').textContent=s?.status==='occupied'?`मौजूदा एक्सपायरी: ${s.expiry_date||'—'}`:'यह सीट खाली है।';$('seatModal').classList.remove('hidden');$('seatModal').classList.add('flex')}
function close(){ $('seatModal').classList.add('hidden');$('seatModal').classList.remove('flex') }$('closeModal').onclick=close;
async function saveSeat(expiry){const name=$('studentNameInput').value.trim(),phone=$('phoneInput').value.trim();if(!name||!/^\d{10}$/.test(phone)){throw new Error('नाम और 10 अंकों का मोबाइल नंबर भरें।')}const {error}=await db.from('seats').update({status:'occupied',student_name:name,phone,expiry_date:expiry}).eq('seat_number',currentSeat);if(error)throw error;}
$('seatForm').onsubmit=async e=>{e.preventDefault();try{const days=Number($('months').value);const existing=seatCache.find(s=>s.seat_number===currentSeat);const base=existing?.status==='occupied'&&existing.expiry_date&&new Date(existing.expiry_date+'T23:59:59')>new Date()?new Date(existing.expiry_date+'T00:00:00'):new Date();base.setDate(base.getDate()+days);await saveSeat(localDateString(base));$('modalMsg').textContent='सीट अपडेट हो गई।';await loadSeats();}catch(err){$('modalMsg').textContent=err.message||'अपडेट नहीं हुआ';}};
$('cashRenew').onclick=async()=>{try{const s=seatCache.find(x=>x.seat_number===currentSeat);if(!s||s.status!=='occupied')throw new Error('पहले इस सीट पर एडमिशन जोड़ें।');const days=Number($('months').value);const base=s.expiry_date&&new Date(s.expiry_date+'T23:59:59')>new Date()?new Date(s.expiry_date+'T00:00:00'):new Date();base.setDate(base.getDate()+days);const {error}=await db.from('seats').update({expiry_date:localDateString(base)}).eq('seat_number',currentSeat);if(error)throw error;$('modalMsg').textContent='कैश रिन्यूअल अपडेट हो गया।';await loadSeats();}catch(e){$('modalMsg').textContent=e.message;}};
$('makeVacant').onclick=async()=>{if(!confirm(`सीट ${currentSeat} को खाली करना है?`))return;const {error}=await db.from('seats').update({status:'vacant',student_name:null,phone:null,expiry_date:null}).eq('seat_number',currentSeat);$('modalMsg').textContent=error?.message||'सीट खाली कर दी गई।';if(!error)await loadSeats();};
$('generateAll').onclick=()=>{if(!PUBLIC_SITE_URL.startsWith('https://')||PUBLIC_SITE_URL.includes('YOUR-')){alert('पहले admin.html में PUBLIC_SITE_URL सेट करें।');return;}$('qrGrid').innerHTML='';for(let n=1;n<=75;n++){const wrap=document.createElement('div');wrap.className='rounded-xl bg-white p-3 text-center text-slate-900';const qr=document.createElement('div');qr.className='mx-auto flex justify-center';const label=document.createElement('p');label.className='mt-2 font-bold';label.textContent=`Seat ${n}`;const a=document.createElement('a');a.className='mt-2 inline-block text-sm text-blue-700 underline';a.textContent='QR डाउनलोड';a.href='#';wrap.append(qr,label,a);$('qrGrid').appendChild(wrap);const url=`${PUBLIC_SITE_URL}/?seat=${n}`;new QRCode(qr,{text:url,width:150,height:150});a.onclick=e=>{e.preventDefault();const img=qr.querySelector('img');const canvas=qr.querySelector('canvas');const src=img?.src||canvas?.toDataURL('image/png');if(!src)return;const link=document.createElement('a');link.href=src;link.download=`library-seat-${n}.png`;link.click();};}};
checkSession();
</script></body></html>
