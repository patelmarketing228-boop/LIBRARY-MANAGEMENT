<!doctype html>
<html lang="hi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Library Seat Details</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body class="min-h-screen bg-slate-950 text-white flex items-center justify-center p-4">
  <main class="w-full max-w-lg rounded-2xl border border-slate-800 bg-slate-900 p-6 shadow-2xl">
    <div class="mb-5 text-center"><p class="text-sm uppercase tracking-[.25em] text-indigo-300">Library Member Portal</p><h1 class="mt-2 text-3xl font-bold">सीट की जानकारी</h1></div>
    <div id="message" class="rounded-xl bg-slate-800 p-4 text-center text-slate-300">सीट की जानकारी लोड हो रही है...</div>
    <section id="seatPanel" class="hidden mt-5">
      <div class="mb-4 flex items-center justify-between"><h2 class="text-xl font-semibold">सीट नंबर <span id="seatNo"></span></h2><span id="statusBadge" class="rounded-full px-3 py-1 text-xs font-bold"></span></div>
      <div id="studentInfo" class="space-y-3 rounded-xl bg-slate-800 p-4">
        <p>छात्र का नाम: <strong id="studentName"></strong></p><p>मोबाइल नंबर: <strong id="phone"></strong></p><p>एक्सपायरी डेट: <strong id="expiry"></strong></p>
      </div>
      <div id="renewal" class="mt-5 hidden"><h3 class="mb-3 font-semibold">अपना रिन्यूअल प्लान चुनें</h3>
        <div class="grid grid-cols-2 gap-3"><button data-days="30" data-amount="500" class="payBtn rounded-xl bg-indigo-600 p-4 font-semibold hover:bg-indigo-500">1 महीना<strong class="block text-xl">₹500</strong></button><button data-days="90" data-amount="1300" class="payBtn rounded-xl bg-emerald-600 p-4 font-semibold hover:bg-emerald-500">3 महीने<strong class="block text-xl">₹1300</strong></button></div>
        <p class="mt-3 text-xs text-slate-400">पेमेंट सफल होने और सर्वर से वेरिफाई होने के बाद ही वैलिडिटी बढ़ेगी।</p>
      </div>
    </section>
    <p class="mt-6 text-center text-xs text-slate-500">किसी सहायता या नए एडमिशन के लिए लाइब्रेरी ऑफिस से संपर्क करें।</p>
  </main>
<script>
// Replace these public frontend values before deployment. Never put service-role or Razorpay secret here.
const WORKER_URL = 'https://YOUR-WORKER.workers.dev';
const RAZORPAY_KEY_ID = 'YOUR_RAZORPAY_KEY_ID';
const $ = id => document.getElementById(id);
const seatNumber = Number(new URLSearchParams(location.search).get('seat'));
const moneyDate = value => value ? new Date(value + 'T00:00:00').toLocaleDateString('hi-IN',{day:'2-digit',month:'long',year:'numeric'}) : '—';
async function loadSeat(){
  if(!Number.isInteger(seatNumber)||seatNumber<1||seatNumber>75){$('message').textContent='कृपया सही सीट QR कोड स्कैन करें।';return;}
  $('message').textContent='सीट की जानकारी लोड हो रही है...';
  const response=await fetch(`${WORKER_URL}/seat?seat=${seatNumber}`);
  const payload=await response.json();const data=payload.seat;
  if(!response.ok||!data){$('message').textContent=payload.error||'जानकारी नहीं मिल सकी। कृपया ऑफिस से संपर्क करें।';return;}
  $('message').classList.add('hidden');$('seatPanel').classList.remove('hidden');$('seatNo').textContent=data.seat_number;
  if(data.status==='vacant'){
    $('statusBadge').textContent='खाली';$('statusBadge').className='rounded-full bg-green-500/20 px-3 py-1 text-xs font-bold text-green-300';
    $('studentInfo').classList.add('hidden');$('renewal').classList.add('hidden');$('message').classList.remove('hidden');$('message').textContent='यह सीट खाली है, नया एडमिशन लेने के लिए लाइब्रेरी ऑफिस/एडमिन से संपर्क करें।';return;
  }
  $('statusBadge').textContent='भरी हुई';$('statusBadge').className='rounded-full bg-red-500/20 px-3 py-1 text-xs font-bold text-red-300';
  $('studentName').textContent=data.student_name||'—';$('phone').textContent=data.phone||'—';$('expiry').textContent=moneyDate(data.expiry_date);
  $('renewal').classList.remove('hidden');
}
async function pay(days,amount){
  try{
    const orderRes=await fetch(WORKER_URL+'/create-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({seat_number:seatNumber,days})});
    const order=await orderRes.json();if(!orderRes.ok)throw new Error(order.error||'Order नहीं बन पाया');
    const options={key:RAZORPAY_KEY_ID,amount:order.amount,currency:order.currency, name:'Library Renewal',description:`Seat ${seatNumber} renewal - ${days} days`,order_id:order.id,
      handler:async response=>{
        const verifyRes=await fetch(WORKER_URL+'/verify-payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...response,seat_number:seatNumber,days})});
        const result=await verifyRes.json();if(!verifyRes.ok)throw new Error(result.error||'Payment verification failed');
        alert('पेमेंट सफल! आपकी नई एक्सपायरी डेट: '+moneyDate(result.expiry_date));loadSeat();
      },prefill:{},theme:{color:'#4f46e5'}};
    new Razorpay(options).open();
  }catch(e){alert(e.message||'कुछ गलत हुआ। कृपया दोबारा प्रयास करें।');}
}
document.querySelectorAll('.payBtn').forEach(btn=>btn.addEventListener('click',()=>pay(Number(btn.dataset.days),Number(btn.dataset.amount))));
loadSeat();
</script>
</body></html>
